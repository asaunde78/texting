services:
    textbelt:
      build: .
      container_name: textbelt
      ports:
        - '9090:9090'
    mail:
      image: turgon37/smtp-relay:latest
      environment:
        RELAY_POSTMASTER: 'txt@zinkithink.com'
        RELAY_MYHOSTNAME: 'zinkithink.com'
        RELAY_MYDOMAIN: 'zinkithink.com'
      ports:
        - "587:25"
    redis:
        image: redis:latest
        container_name: my-redis
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        restart: unless-stopped

volumes:
    redis-data:
        driver: local
